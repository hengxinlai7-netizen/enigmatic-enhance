plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 供 processResources 展开与 jar manifest 使用
def mod_authors = 'hengx'
def mod_description = '神秘遗物增强:针对神秘遗物(Enigmatic Legacy)的增强。内容待定,目前只有可构建、可加载的骨架。'

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}, ${System.getProperty('java.vm.name')})"
println "Architecture: ${System.getProperty('os.arch')}"

minecraft {
    // 官方映射:1.20.1 运行期即使用 Mojang 官方名称
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.config', 'enigmaticenhance.mixins.json,enigmaticenhance.optional.mixins.json'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.config', 'enigmaticenhance.mixins.json,enigmaticenhance.optional.mixins.json'
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    compileOnly files("libs/goety.jar")
    compileOnly files("libs/goetyawaken.jar")
    compileOnly files("libs/legendarymonsters.jar")
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 目标模组:仅编译期用。
    // 运行时:属性注入用 required=false,救赎之戒相关的 mixin 与 Curios 事件都有守卫,缺模组不会崩。
    compileOnly files('libs/enigmaticaddons-1.2.6.jar')
    compileOnly files('libs/curios-forge-5.14.1+1.20.1.jar')
    compileOnly files('libs/Enigmaticlegacy-2.30.1-1.jar')
    compileOnly files('libs/tacz-1.20.1-1.1.8-hotfix.jar')
    // 神化(仅编译期:让 Mixin 注解处理器能解析 @Mixin(targets="dev.shadowsoffire...") 的目标类;
    // 代码里不引用任何神化类型,缺神化时运行时走 required=false 的 mixin 跳过逻辑)。
    compileOnly files('libs/Apotheosis-1.20.1-7.4.8.jar')
    compileOnly files('libs/Placebo-1.20.1-8.6.3.jar')
    // JEI (compile-only): used for item info pages so JEI can look up these bottle items which have no crafting recipe.
    compileOnly files('libs/jei-1.20.1-forge-15.20.0.129.jar')
    // 远古重铸台(仅编译期:让 Mixin 注解处理器能解析 @Mixin(targets="com.ianm1647...") 的注释目标;
    // 运行时是第三方模组、可能缺席,登记在 enigmaticenhance.optional.mixins.json(required:false + defaultRequire:0))。
    compileOnly files('libs/ancientreforging-1.3.jar')
    compileOnly files('libs/lootr-forge-1.20-0.7.35.94.jar')

    // Mixin 注解处理器(编译期校验 @Mixin 注入目标)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// 展开 mods.toml 中的 ${...} 占位符
def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: '[1.20.1,1.20.2)',
            forge_version: forge_version,
            forge_version_range: '[47.2.0,)',
            loader_version_range: '[47,)',
            mod_id: mod_id,
            mod_name: '神秘遗物增强',
            mod_license: 'MIT',
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Forge 从 MANIFEST 的这个属性加载 mixin 配置(逗号分隔:主配置 + 可选第三方兼容配置)
                'MixinConfigs'            : 'enigmaticenhance.mixins.json,enigmaticenhance.optional.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
